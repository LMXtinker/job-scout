name: inbox

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten neue Telegram-Nachrichten an den Bot verarbeiten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scout/inbox.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CC_CHAT_IDS: ${{ secrets.TELEGRAM_CC_CHAT_IDS }}
      - name: Änderungen committen
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          for f in data/preferences.json data/tg_offset.json data/inbox_usage.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "inbox: Telegram-Wünsche"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
