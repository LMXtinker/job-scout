name: digest

on:
  # Ziel 08:00 Wien. GitHub startet geplante Läufe oft stark verspätet – daher mehrere Einträge
  # plus direkt nach jedem Scraper-Lauf. Das Skript sendet höchstens einmal pro Tag.
  schedule:
    - cron: "41 5 * * *"
    - cron: "41 6 * * *"
    - cron: "11 8 * * *"
    - cron: "11 10 * * *"
    - cron: "11 12 * * *"
  workflow_run:
    workflows: [scout]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Vorschau (nichts senden)"
        type: boolean
        default: false
      auto:
        description: "Wie ein geplanter Lauf behandeln (für externen Auslöser, z. B. cron-job.org)"
        type: boolean
        default: false
      weekly:
        description: "Wochenrückblick anhängen (sonst nur montags)"
        type: boolean
        default: false
      resend:
        description: "Auch schon gesendete Stellen berücksichtigen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scout/digest.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CC_CHAT_IDS: ${{ secrets.TELEGRAM_CC_CHAT_IDS }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          RESEND: ${{ github.event.inputs.resend }}
          WEEKLY: ${{ github.event.inputs.weekly }}
          AUTO: ${{ github.event.inputs.auto }}
      - name: Status committen
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data debug
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
