name: scout

on:
  schedule:
    - cron: "23 3 * * *"   # täglich ~05:23 Wien (Sommerzeit) / 04:23 (Winterzeit); danach läuft digest
  workflow_dispatch:
    inputs:
      sources:
        description: "Nur diese Quellen (Leerzeichen-getrennt), leer = alle"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scout/scrape.py ${{ github.event.inputs.sources }}
      - name: Ergebnisse committen
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data debug
          git diff --cached --quiet || git commit -m "scout: $(date -u +%F\ %H:%M) $(python -c 'import json;s=json.load(open("data/status.json"));print(f"jobs={s[\"jobs\"]} new={s[\"new\"]}")' 2>/dev/null)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
